<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrabbiata · Pizza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ocre:       #D4B483;
      --ocre-d:     #B8955A;
      --azul-elec:  #1A5FBF;
      --rojo:       #CC1414;
      --rojo-d:     #A50E0E;
      --blanco:     #F8F6F2;
      --crema:      #F0E6D0;
      --marron:     #2b1a0a;
      --amarillo:   #FDB740;
      --verde-wa:   #25D366;
      --verde-wa-d: #128C7E;
      --font-display: 'DM Serif Display', serif;
      --font-body:    'DM Sans', Arial, sans-serif;
    }

    html, body { min-height: 100%; }

    /* Fondo: blanco con grilla roja, igual que la sección carta */
    body {
      background-color: var(--blanco);
      background-image:
        linear-gradient(rgba(204,20,20,.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(204,20,20,.10) 1px, transparent 1px);
      background-size: 36px 36px;
      font-family: var(--font-body);
      color: var(--marron);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2.5rem 1.25rem 3rem;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Wrapper principal: estructura con borde rojo como la carta ── */
    .wrapper {
      width: 100%;
      max-width: 460px;
      background: var(--blanco);
      border: 4px solid var(--rojo);
      border-radius: 0;
      box-shadow: 6px 6px 0 var(--rojo-d);
      overflow: hidden;
      opacity: 0;
      animation: aparecer 0.45s ease 0.05s forwards;
    }

    /* ── Header: ocre + borde azul como el nav ── */
    .brand-header {
      background: var(--ocre);
      border-bottom: 3px solid var(--azul-elec);
      box-shadow: 0 3px 0 var(--azul-elec);
      padding: 1.6rem 1.5rem 1.4rem;
      text-align: center;
      position: relative;
      /* grilla de azulejos sutil */
      background-image:
        linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px);
      background-size: 30px 30px;
      background-color: var(--ocre);
    }

    .brand-eyebrow {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--marron);
      opacity: 0.6;
      margin-bottom: 0.3rem;
    }

    /* Nombre en rojo como el cartel del local */
    .brand-name {
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 11vw, 3.8rem);
      color: var(--rojo);
      line-height: 1;
      letter-spacing: 0.01em;
      text-shadow: 2px 2px 0 rgba(165,14,14,.25);
    }

    .brand-rule {
      height: 2px;
      background: var(--azul-elec);
      margin: 0.8rem auto 0.65rem;
      width: 60%;
      opacity: 0.4;
    }

    .brand-sub {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--marron);
      opacity: 0.7;
      letter-spacing: 0.05em;
    }

    /* ── Links ── */
    #links {
      display: flex;
      flex-direction: column;
      /* sin gap: bordes colapsados como tabla */
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.9rem 1.1rem;
      text-decoration: none;
      color: var(--marron);
      background: var(--blanco);
      border-top: 2px solid rgba(204,20,20,.18);
      position: relative;
      transition: background 0.12s ease, padding-left 0.12s ease;
      overflow: hidden;
    }

    /* línea de color izquierda */
    .link::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: var(--azul-elec);
      transition: width 0.15s ease;
    }
    .link.ig::before    { background: #e1306c; }
    .link.web::before   { background: var(--rojo); }
    .link.maps::before  { background: var(--azul-elec); }
    .link.wa::before    { background: var(--verde-wa); }

    .link:hover {
      background: #fdf5ea;
      padding-left: 1.3rem;
    }
    .link:hover::before { width: 7px; }

    .link:active { background: #f5e8d0; }

    /* ícono en cuadrado rojo como los botones de la carta */
    .link-icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: var(--rojo);
      border: 2px solid var(--rojo-d);
      border-radius: 0;
    }
    .link.ig   .link-icon { background: #e1306c; border-color: #c01050; }
    .link.maps .link-icon { background: var(--azul-elec); border-color: #0f4490; }
    .link.wa   .link-icon { background: var(--verde-wa); border-color: var(--verde-wa-d); }

    .link-icon svg {
      width: 20px; height: 20px;
      fill: #fff;
    }

    .link-text { display: flex; flex-direction: column; gap: 0.06rem; flex: 1; }

    .link-label {
      font-family: var(--font-display);
      font-size: 1.05rem;
      color: var(--marron);
      line-height: 1.2;
    }

    .link-sublabel {
      font-family: var(--font-body);
      font-size: 0.73rem;
      font-weight: 300;
      color: #8a6030;
      letter-spacing: 0.03em;
    }

    .link-arrow {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--rojo);
      opacity: 0.5;
      flex-shrink: 0;
      transition: opacity 0.12s, transform 0.12s;
    }
    .link:hover .link-arrow { opacity: 1; transform: translateX(3px); }

    /* ── Footer dentro del wrapper ── */
    .brand-footer {
      background: var(--rojo);
      padding: 0.7rem 1rem;
      text-align: center;
    }
    .brand-footer p {
      font-family: var(--font-display);
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0.9;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem 0.85rem 2rem; }
    }
  </style>
</head>
<body>
